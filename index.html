  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:"한컴산뜻돋움","Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:15px;line-height:1.4}
  header{background:var(--head);color:var(--head-fg);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;flex:1;min-width:140px}
  button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  main{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
  .bar .month{font-size:20px;font-weight:700;min-width:140px;text-align:center}
  .filters{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;color:var(--muted)}
  .filters label{display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--fg)}
  .filters input{accent-color:var(--accent);width:16px;height:16px}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .dow{background:var(--card);text-align:center;padding:6px 0;font-weight:700}
  .dow.sun,.cell.sun .num{color:var(--red)} .dow.sat,.cell.sat .num{color:var(--blue)}
  .cell{background:var(--card);min-height:96px;padding:4px;cursor:pointer;overflow:hidden;position:relative}
  .cell.other{background:var(--other)} .cell.other .num{opacity:.5}
  .cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
  .cell.hol .num{color:var(--red)}
  .num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;font-weight:700;padding:0 4px}
  .cell.today .num{background:var(--accent);color:#fff}
  .hname{font-size:11px;color:var(--red);margin-left:4px}
  .chip{display:block;margin-top:2px;padding:1px 5px;border-radius:4px;color:#fff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.shared{opacity:.78;outline:1px dashed rgba(255,255,255,.7);outline-offset:-2px}
  .more{font-size:11px;color:var(--muted);margin-top:2px}
  .panel{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .panel h2{margin:0 0 8px;font-size:16px}
  .ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .ev:first-of-type{border-top:0}
  .bar-c{width:5px;border-radius:3px;flex:none}
  .ev .t{font-weight:700} .ev .m{color:var(--muted);font-size:13px;white-space:pre-wrap}
  .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
  .msg{padding:24px;text-align:center;color:var(--muted)}
  .msg.err{color:var(--red)}
  .hidden{display:none!important}
  .bar .month{font-size:26px!important;min-width:190px!important}
  .bar2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 10px;padding:8px 10px;background:var(--card);
    border:1px solid var(--line);border-radius:10px}
  .bar2 label{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
  .bar2 input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}
  .bar2 select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
  .bar2 select.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  details.an{position:relative} details.an summary{cursor:pointer;list-style:none;padding:5px 10px;border:1px solid var(--line);border-radius:8px}
  details.an .pop{position:absolute;z-index:5;top:34px;left:0;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;display:grid;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);min-width:200px}
  .lun{position:absolute;right:5px;top:5px;font-size:11px;color:var(--muted)}
  .an-line{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .ymon{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .ymon h3{margin:0 0 4px;font-size:16px;cursor:pointer} .ymon h3.now{color:var(--accent)}
  .yd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:13px;row-gap:2px}
  .yd span{padding:2px 0;border-radius:12px;cursor:pointer;position:relative} .yd .dw{color:var(--muted);cursor:default}
  .yd .sun{color:var(--red)} .yd .sat{color:var(--blue)} .yd .tdy{background:var(--accent);color:#fff}
  .yd .ev::after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:var(--accent)}
  .dnote{font-size:13px;color:var(--muted);margin:2px 0 6px}
  .dnote b{color:var(--fg)}
  /* ---- 프로그램 로그인(작은 창) ---- */
  body.desk{background:linear-gradient(160deg,#fff3bf 0%,#ffe066 45%,#ffa94d 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
  body.desk header{display:none}
  body.desk main{padding:16px;max-width:none;width:100%}
  @media (prefers-color-scheme: dark){ body.desk{background:linear-gradient(160deg,#2b2412,#3a2f10 55%,#5c3d12)} }
  .lcard{max-width:380px;margin:0 auto;background:var(--card);border-radius:20px;padding:30px 26px 22px;text-align:center;
    box-shadow:0 14px 40px rgba(120,70,0,.22)}
  .logo{width:68px;height:68px;margin:0 auto 14px;border-radius:20px;background:linear-gradient(135deg,#ffc078,#f6a53f);
    display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 6px 16px rgba(240,140,0,.4)}
  .lcard h2{margin:0 0 6px;font-size:21px}
  .lcard .sub{margin:0 0 22px;color:var(--muted);font-size:14px}
  .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 14px;border-radius:10px;
    background:#fff;color:#3c4043;border:1px solid #dadce0;font-size:15px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .gbtn:hover{box-shadow:0 2px 8px rgba(0,0,0,.18);border-color:#c6c9cc}
  .gbtn svg{width:20px;height:20px}
  .who2{display:flex;align-items:center;gap:12px;text-align:left;background:var(--other);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;margin-bottom:14px}
  .who2 img,.who2 .av{width:42px;height:42px;border-radius:50%;flex:none;background:var(--accent);color:#fff;display:flex;
    align-items:center;justify-content:center;font-weight:700;font-size:18px;object-fit:cover}
  .who2 b{display:block} .who2 small{color:var(--muted);word-break:break-all}
  .lcard .primary{width:100%;padding:12px;font-size:15px;border-radius:10px}
  .lcard .link{display:inline-block;margin-top:12px;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px}
  .lcard .note{margin:16px 0 0;color:var(--muted);font-size:12px;line-height:1.5}
  .lcard .done{font-size:44px;margin:4px 0 8px}
  .phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px} .phead h2{margin:0;flex:1;min-width:160px}
  .ev .acts{margin-left:auto;display:flex;gap:6px;align-items:flex-start;flex:none}
  .ev .acts button{padding:3px 9px;font-size:13px}
  .ev .acts .del{color:var(--red)}
  dialog{border:0;border-radius:16px;padding:0;background:var(--card);color:var(--fg);width:min(480px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  .dform{padding:18px 20px 16px;display:grid;gap:10px}
  .dform h3{margin:0 0 2px;font-size:18px}
  .dform label{display:grid;gap:3px;font-size:13px;color:var(--muted)}
  .dform input,.dform select,.dform textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
  .dform .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dform .chk{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:14px}
  .dform .chk input{width:auto;accent-color:var(--accent)}
  .dform .colors{display:flex;gap:8px}
  .dform .colors label{display:block;cursor:pointer}
  .dform .colors input{position:absolute;opacity:0;width:0}
  .dform .colors span{display:block;width:30px;height:30px;border-radius:50%;border:3px solid transparent}
  .dform .colors input:checked+span{border-color:var(--fg)}
  .dform .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  .dform .err{color:var(--red);font-size:13px;min-height:18px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#212529;color:#fff;padding:10px 16px;border-radius:10px;z-index:20;font-size:14px}
  #fab{display:none}
  @media (max-width:640px){
    body{font-size:16px;-webkit-text-size-adjust:100%}
    header{padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));gap:8px}
    header h1{font-size:16px;min-width:0}
    header h1 span{display:block;margin:2px 0 0 38px}
    #who{display:none}
    main{padding:8px 10px calc(96px + env(safe-area-inset-bottom))}
    button{min-height:40px}
    .bar{flex-wrap:nowrap;gap:6px;margin:2px 0 8px}
    .bar button{padding:6px 10px;flex:none}
    .bar .month{font-size:19px!important;min-width:0!important;flex:1;white-space:nowrap}
    .bar2{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .bar2::-webkit-scrollbar{display:none}
    .bar2>*{flex:none} #pcNote{display:none}
    .bar2 select,.bar2 details.an summary{min-height:38px;font-size:15px}
    details.an .pop{position:fixed;left:12px;right:12px;top:auto;bottom:12px;max-height:60vh;overflow:auto}
    .cell{min-height:64px;padding:2px}
    .cell .num{min-width:22px;height:22px;font-size:14px}
    .lun{display:none}
    .chip{display:inline-block;width:8px;height:8px;margin:3px 2px 0 0;padding:0;border-radius:50%;font-size:0}
    .more{display:none}
    .cell.sel{outline-width:3px}
    .panel{padding:12px 12px;margin-top:10px}
    .phead h2{font-size:15px;min-width:0;flex-basis:100%}
    #btnAdd{display:none}
    .ev{flex-wrap:wrap;gap:8px}
    .ev .acts{width:100%;justify-content:flex-end}
    .ev .acts button{min-height:36px;padding:4px 14px}
    .ygrid{grid-template-columns:repeat(2,1fr);gap:8px}
    .yd{font-size:12px}
    #fab{display:flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:56px;height:56px;min-height:0;
      border-radius:50%;padding:0;align-items:center;justify-content:center;font-size:30px;line-height:1;z-index:15;
      box-shadow:0 6px 18px rgba(240,140,0,.5)}
    dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:94vh}
    .dform{padding:16px 16px calc(14px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto}
    .dform input,.dform select,.dform textarea{font-size:16px;min-height:42px}
    .dform .row2{gap:8px}
    .dform .btns button{min-height:44px;padding:8px 18px}
    .toast{bottom:90px;max-width:90vw;text-align:center}
  }
  code{background:var(--other);padding:1px 5px;border-radius:4px}
  @media (max-width:640px){
    .cell{min-height:58px;padding:3px}
    .chip{height:6px;padding:0;font-size:0;border-radius:3px}
    .hname{display:none}
    .filters{margin-left:0}
  }
</style>
</head>

  if (startsOn(e, d)) return true;

  time: d.time||"", repeat: d.repeat||"none", color: Number(d.color)||0, memo: d.memo||"", holiday: !!d.holiday,

function cacheWrite(full){
  try { const c = cacheRead(); localStorage.setItem(CACHE_KEY(user.uid), JSON.stringify({ events: [...evMap.values()], since: sinceMs, full: full || (c ? c.full : Date.now()) })); } catch(e){}
}
async function sync(mode){
  const col = collection(db, "users", user.uid, "events"), keep = keepIso();
  if (mode === "full"){
    const snap = await getDocs(query(col, where("last", ">=", keep)));
    evMap = new Map(); sinceMs = 0;
    snap.forEach(x => { const d = x.data(); sinceMs = Math.max(sinceMs, Number(d.upd)||0); if (!d.deleted && d.date) evMap.set(String(d.id || x.id), toEv(d, x.id)); });
    if (!sinceMs) sinceMs = Date.now();
    cacheWrite(Date.now());
  } else {
    const snap = await getDocs(query(col, where("upd", ">", Math.max(0, sinceMs - MARGIN))));
    snap.forEach(x => { const d = x.data(), k = String(d.id || x.id); sinceMs = Math.max(sinceMs, Number(d.upd)||0);
      if (d.deleted || !d.date) evMap.delete(k); else evMap.set(k, toEv(d, x.id)); });

 1년 중 가장 더운 때.","입추":"가을이 시작되는 절기.","처서":"더위가 물러가는 때. 아침저녁으로 선선해진다.","백로":"풀잎에 흰 이슬이 맺히기 시작하는 때.","추분":"낮과 밤의 길이가 같아지는 가을의 한가운데.","한로":"찬 이슬이 맺히는 때. 단풍이 짙어진다.","상강":"서리가 내리기 시작하는 때.","입동":"겨울이 시작되는 절기. 김장을 준비한다.","소설":"첫눈이 내리기 시작한다는 작은 눈의 절기.","대설":"눈이 많이 내린다는 절기.","동지":"1년 중 밤이 가장 긴 날. 팥죽을 먹는 풍습이 있다.","초복":"삼복(초복·중복·말복)의 시작. 삼계탕 등으로 더위를 이겨내는 풍습.","중복":"삼복 더위의 한가운데. 보양식을 먹는 풍습.","말복":"삼복의 마지막 날. 더위가 꺾이기 시작하는 때."}};
const LUN = D.lunar.split(" ").map(t => ({ st: Date.UTC(2000+ +t.slice(0,2), +t.slice(2,4)-1, +t.slice(4,6)), leap: parseInt(t[6],16), lens: t.slice(7) }));

function lunarOf(iso){
  const [y,m,d] = iso.split("-").map(Number), t = Date.UTC(y, m-1, d); let lo = null;
  for (const e of LUN){ if (e.st <= t) lo = e; else break; }
  if (!lo) return null;
  let off = Math.round((t - lo.st) / 86400000), mn = 1;
  for (let i = 0; i < lo.lens.length; i++){
    const n = lo.lens[i] === "1" ? 30 : 29;
    if (off < n) return { m: mn, d: off + 1, leap: !!lo.leap && i === lo.leap };
    off -= n;
    if (!(lo.leap && i === lo.leap - 1)) mn++;

}
const lunarText = (iso, short) => { const r = lunarOf(iso); if (!r) return ""; return (short && r.d !== 1) ? String(r.d) : `${r.leap?"윤":""}${r.m}.${r.d}`; };

function termName(iso){
  const [y,m,d] = iso.split("-").map(Number), t = TERMS[y]; if (!t) return "";
  for (const j of [m*2-2, m*2-1]) if (t[j] === d) return D.termNames[j];
  return "";
}
function bokName(iso){
  const [y,m] = iso.split("-").map(Number); if (m < 6 || m > 8 || !TERMS[y] || !isGyeong(iso)) return "";

  const add = (iso0, k) => { const [yy,mm,dd] = iso0.split("-").map(Number); return isoOf(new Date(yy, mm-1, dd+k)); };

function nthWeekday(y, m, wd, n){   // wd: 0=월 … 6=일

// ---- 일정 입력·수정·삭제 (PC 프로그램과 같은 형식으로 저장 → PC가 5분 안에 받아 감)
let editing = null, toastT = 0;
function toast(t){ let el = document.querySelector(".toast"); if (!el){ el = document.createElement("div"); el.className = "toast"; document.body.appendChild(el); }
  el.textContent = t; el.classList.remove("hidden"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.add("hidden"), 3500); }
function buildForm(){
  $("fKindIn").innerHTML = ""; ["", ...KINDS].forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = k || "(선택 안 함)"; $("fKindIn").appendChild(o); });
  $("fColors").innerHTML = "";
  COLORS.forEach((c, i) => { const l = document.createElement("label"), r = document.createElement("input"); r.type = "radio"; r.name = "fcolor"; r.value = i;
    const sp = document.createElement("span"); sp.style.background = c; l.append(r, sp); $("fColors").appendChild(l); });
  const fill = (id, f) => { $(id).innerHTML = ""; [...new Set(events.map(e => e[f]).filter(Boolean))].sort().forEach(v => { const o = document.createElement("option"); o.value = v; $(id).appendChild(o); }); };
  fill("dlDept", "dept"); fill("dlTeam", "team");
}
function openDlg(e){
  if (!user) return;
  editing = e || null; buildForm();
  $("dTitle").textContent = e ? "일정 수정" : "일정 추가"; $("dErr").textContent = "";
  $("fTitle").value = e ? e.title : ""; $("fDate").value = e ? e.date : selected; $("fEnd").value = e ? (e.end || "") : "";
  $("fAllday").checked = e ? !e.time : true; $("fTime").value = e && e.time ? e.time : "09:00"; $("fTime").disabled = $("fAllday").checked;
  $("fRep").value = e ? (e.repeat || "none") : "none"; $("fAlarm").value = e && e.alarm != null ? String(e.alarm) : "";
  $("fKindIn").value = e ? (e.kind || "") : (prefs.fk || ""); $("fDeptIn").value = e ? (e.dept || "") : (prefs.fd || (events.find(x => x.dept)?.dept || ""));
  $("fTeamIn").value = e ? (e.team || "") : (prefs.ft || ""); $("fMemo").value = e ? (e.memo || "") : ""; $("fHol").checked = !!(e && e.holiday);
  const ci = e ? (e.color % COLORS.length) : 0; document.querySelector(`#fColors input[value="${ci}"]`).checked = true;
  $("dlg").showModal(); $("fTitle").focus();
}
async function saveEv(){
  const title = $("fTitle").value.trim(), date = $("fDate").value, end = $("fEnd").value, err = m => { $("dErr").textContent = m; };
  if (!title) return err("제목을 입력하세요.");
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return err("시작 날짜를 입력하세요.");
  if (end && end < date) return err("끝나는 날이 시작 날짜보다 빠릅니다.");
  const tm = $("fAllday").checked ? "" : $("fTime").value;
  if (!$("fAllday").checked && !/^\d{2}:\d{2}$/.test(tm)) return err("시각을 입력하세요.");
  const rep = $("fRep").value, al = $("fAlarm").value;
  const e = { id: editing ? editing.id : Date.now(), title, date, end: rep === "none" ? end : "", time: tm, repeat: rep,
    alarm: al === "" ? null : Number(al), color: Number(document.querySelector("#fColors input:checked")?.value || 0),
    memo: $("fMemo").value.trim().slice(0, 2000), holiday: $("fHol").checked, kind: $("fKindIn").value,
    dept: $("fDeptIn").value.trim().slice(0, 50), team: $("fTeamIn").value.trim().slice(0, 50), upd: Date.now() };
  const last = rep !== "none" ? "9999-12-31" : (e.end || e.date);
  $("dSave").disabled = true;
  try{
    await setDoc(doc(db, "users", user.uid, "events", String(e.id)), { ...e, last, deleted: false, src: "web" });
    if (editing) Object.assign(editing, e); else events.push(e);
    selected = e.date; view = new Date(+e.date.slice(0,4), +e.date.slice(5,7) - 1, 1);
    evMap.set(String(e.id), editing || e); sinceMs = Math.max(sinceMs, e.upd); cacheWrite();
    $("dlg").close(); fillFilters(); render(); toast("저장했습니다. PC 프로그램에는 5분 안에 반영됩니다.");
  }catch(x){ console.error(x); err(x.code === "permission-denied" ? "저장 권한이 없습니다(보안 규칙 확인)." : "저장하지 못했습니다: " + (x.message || x)); }
  $("dSave").disabled = false;
}
async function removeEv(e){
  if (!confirm(`'${e.title}' 일정을 삭제할까요?` + (e.repeat !== "none" ? "\n(반복 일정 전체가 삭제됩니다)" : ""))) return;
  try{
    await setDoc(doc(db, "users", user.uid, "events", String(e.id)), { id: e.id, title: "", deleted: true, last: "9999-12-31", upd: Date.now(), src: "web" });
    events = events.filter(x => x !== e); evMap.delete(String(e.id)); cacheWrite(); fillFilters(); render(); toast("삭제했습니다.");
  }catch(x){ console.error(x); toast("삭제하지 못했습니다: " + (x.code || x.message)); }
}
$("btnAdd").onclick = () => openDlg(null);
$("fab").onclick = () => openDlg(null);
// 폰: 날짜를 누르면 그 날 일정 목록으로 스크롤, 좌우로 밀면 이전/다음 달
const isPhone = () => innerWidth <= 640;
$("grid").addEventListener("click", () => { if (isPhone()) setTimeout(() => $("dayTitle").scrollIntoView({ behavior: "smooth", block: "start" }), 50); });
let tx = 0, ty = 0;
document.addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener("touchend", e => {
  if ($("dlg").open || !isPhone() || $("app").classList.contains("hidden")) return;
  if (e.target.closest && e.target.closest(".bar2")) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) stepView(dx < 0 ? 1 : -1);
}, { passive: true });
$("dCancel").onclick = () => $("dlg").close();
$("fAllday").onchange = () => { $("fTime").disabled = $("fAllday").checked; };
$("dform").addEventListener("submit", ev => { ev.preventDefault(); saveEv(); });

// ---- 시작
function start(){
  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId){
    $("btnIn").disabled = true;
    showMsg("파일 위쪽의 FIREBASE_CONFIG 값을 채워 주세요. (Firebase 콘솔 > 프로젝트 설정 > 내 앱)", true);
    return;
  }
  const app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app); db = getFirestore(app);
  $("btnIn").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ if (e.code !== "auth/popup-closed-by-user") showMsg("로그인하지 못했습니다: " + (e.code||e.message), true); }
  };
  $("btnOut").onclick = () => { try { if (user) localStorage.removeItem(CACHE_KEY(user.uid)); } catch(e){} signOut(auth); };
  $("deskIn").onclick = () => $("btnIn").onclick();
  $("deskOther").onclick = () => signOut(auth).then(() => $("btnIn").onclick());
  $("deskSend").onclick = () => {
    if (!user) return;
    const q = new URLSearchParams({ state: deskState, refresh: user.refreshToken, uid: user.uid,
      name: user.displayName || "", email: user.email || "" });
    $("deskIn2").classList.add("hidden");
    $("deskSub").innerHTML = '<div class="done">✅</div>프로그램으로 전달하는 중입니다…';
    $("deskNote").textContent = "";
    location.href = `http://127.0.0.1:${deskPort}/?` + q.toString();
  };
  onAuthStateChanged(auth, u => {
    user = u;
    $("btnIn").classList.toggle("hidden", !!u); $("btnOut").classList.toggle("hidden", !u);
    $("who").classList.toggle("hidden", !u);
    if (desktopMode){
      $("msg").classList.add("hidden"); $("app").classList.add("hidden"); $("desk").classList.remove("hidden");
      $("deskOut").classList.toggle("hidden", !!u);
      $("deskIn2").classList.toggle("hidden", !u);
      if (u){
        $("deskSub").textContent = "이 계정으로 일정을 연결할까요?";
        $("deskName").textContent = u.displayName || "(이름 없음)";
        $("deskMail").textContent = u.email || "";
        $("deskAv").innerHTML = "";
        if (u.photoURL){ const im = new Image(); im.src = u.photoURL; im.referrerPolicy = "no-referrer"; $("deskAv").className = "";
          $("deskAv").appendChild(im); im.style.cssText = "width:42px;height:42px;border-radius:50%;display:block"; }
        else { $("deskAv").className = "av"; $("deskAv").textContent = (u.displayName || u.email || "?").charAt(0).toUpperCase(); }
      } else $("deskSub").textContent = "구글 계정으로 내 일정을 연결합니다";
      return;
    }
    if (u){ $("who").textContent = u.displayName || u.email; load(); }
    else { events = []; showMsg("로그인하면 내 일정을 볼 수 있습니다."); }
  });
}
const stepView = k => { if (prefs.vmode === "year") view.setFullYear(view.getFullYear()+k); else view.setMonth(view.getMonth()+k); render(); };
$("prev").onclick = () => stepView(-1);
$("next").onclick = () => stepView(1);
$("today").onclick = () => { view = new Date(); view.setDate(1); selected = isoOf(new Date()); render(); };
$("reload").onclick = () => user && load(false);
$("vmode").onclick = () => { prefs.vmode = prefs.vmode === "year" ? "month" : "year"; savePrefs(); render(); };
$("optLunar").onchange = e => { prefs.lunar = e.target.checked; savePrefs(); render(); };
[["fKind","fk"],["fDept","fd"],["fTeam","ft"]].forEach(([id,k]) => $(id).onchange = e => { prefs[k] = e.target.value; e.target.classList.toggle("on", !!e.target.value); savePrefs(); render(); });
start();
</script>
</body>
