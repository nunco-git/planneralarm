<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일정 달력</title>
<style>
  :root{
    --bg:#f1f3f5; --card:#ffffff; --fg:#212529; --muted:#868e96; --line:#dee2e6;
    --accent:#f08c00; --head:#fff3bf; --head-fg:#4a2f00; --other:#f8f9fa; --today:#fff3bf;
    --red:#e03131; --blue:#1c7ed6;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#16181b; --card:#1f2327; --fg:#e9ecef; --muted:#9aa1a8; --line:#33383d;
      --head:#3a2f10; --head-fg:#ffe8a3; --other:#1a1d20; --today:#3a2f10; --red:#ff6b6b; --blue:#74c0fc; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:"한컴산뜻돋움","Malgun Gothic","맑은 고딕",system-ui,sans-serif;font-size:15px;line-height:1.4}
  header{background:var(--head);color:var(--head-fg);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;flex:1;min-width:140px}
  button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  main{max-width:1100px;margin:0 auto;padding:12px 16px 40px}
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
  .bar .month{font-size:20px;font-weight:700;min-width:140px;text-align:center}
  .filters{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;color:var(--muted)}
  .filters label{display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--fg)}
  .filters input{accent-color:var(--accent);width:16px;height:16px}
  .grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .dow{background:var(--card);text-align:center;padding:6px 0;font-weight:700}
  .dow.sun,.cell.sun .num{color:var(--red)} .dow.sat,.cell.sat .num{color:var(--blue)}
  .cell{background:var(--card);min-height:96px;padding:4px;cursor:pointer;overflow:hidden;position:relative}
  .cell.other{background:var(--other)} .cell.other .num{opacity:.5}
  .cell.sel{outline:2px solid var(--accent);outline-offset:-2px}
  .cell.hol .num{color:var(--red)}
  .num{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:12px;font-weight:700;padding:0 4px}
  .cell.today .num{background:var(--accent);color:#fff}
  .hname{font-size:11px;color:var(--red);margin-left:4px}
  .chip{display:block;margin-top:2px;padding:1px 5px;border-radius:4px;color:#fff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip.shared{opacity:.78;outline:1px dashed rgba(255,255,255,.7);outline-offset:-2px}
  .more{font-size:11px;color:var(--muted);margin-top:2px}
  .panel{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .panel h2{margin:0 0 8px;font-size:16px}
  .ev{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .ev:first-of-type{border-top:0}
  .bar-c{width:5px;border-radius:3px;flex:none}
  .ev .t{font-weight:700} .ev .m{color:var(--muted);font-size:13px;white-space:pre-wrap}
  .tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
  .msg{padding:24px;text-align:center;color:var(--muted)}
  .msg.err{color:var(--red)}
  .hidden{display:none!important}
  code{background:var(--other);padding:1px 5px;border-radius:4px}
  @media (max-width:640px){
    .cell{min-height:58px;padding:3px}
    .chip{height:6px;padding:0;font-size:0;border-radius:3px}
    .hname{display:none}
    .filters{margin-left:0}
  }
</style>
</head>
<body>
<header>
  <h1>📅 내 일정 달력 <span style="font-weight:400;font-size:13px;opacity:.75">(조회 전용)</span></h1>
  <span id="who" class="hidden"></span>
  <button id="btnIn" class="primary">구글 로그인</button>
  <button id="btnOut" class="hidden">로그아웃</button>
</header>
<main>
  <div id="msg" class="msg">로그인하면 내 일정을 볼 수 있습니다.</div>
  <section id="desk" class="panel hidden">
    <h2>반복알람 프로그램 로그인</h2>
    <p id="deskMsg"></p>
    <button id="deskSend" class="primary hidden">이 계정으로 프로그램에 로그인</button>
    <p style="color:var(--muted);font-size:13px">버튼을 누르면 이 PC에서 실행 중인 반복알람 프로그램으로 로그인 정보가 전달됩니다. 직접 연 페이지라면 누르지 마세요.</p>
  </section>
  <section id="app" class="hidden">
    <div class="bar">
      <button id="prev" aria-label="이전 달">◀</button>
      <div class="month" id="monthLbl"></div>
      <button id="next" aria-label="다음 달">▶</button>
      <button id="today">오늘</button>
      <button id="reload" title="다시 불러오기">↻</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="panel"><h2 id="dayTitle"></h2><div id="dayList"></div></div>
  </section>
</main>

<script type="module">
// ▼▼▼ Firebase 콘솔 > 프로젝트 설정 > 내 앱(웹)에서 복사한 값으로 바꾸세요 ▼▼▼
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDZS8cacPdO-c3BdaXH5jNgHFdJtFCeTo8",
  authDomain: "planneralarm-6271e.firebaseapp.com",
  projectId: "planneralarm-6271e",
  storageBucket: "planneralarm-6271e.firebasestorage.app",
  messagingSenderId: "497208787655",
  appId: "1:497208787655:web:252ea79bbe2478553374e2",
  measurementId: "G-21D18BG4T0"
};
// ▲▲▲ ----------------------------------------------------------------- ▲▲▲

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const HOLIDAYS = {
  "2026-01-01":"신정","2026-02-16":"설날 연휴","2026-02-17":"설날","2026-02-18":"설날 연휴","2026-03-01":"삼일절",
  "2026-03-02":"대체공휴일","2026-05-05":"어린이날","2026-05-24":"부처님오신날","2026-05-25":"대체공휴일",
  "2026-06-03":"지방선거","2026-06-06":"현충일","2026-07-17":"제헌절","2026-08-15":"광복절","2026-08-17":"대체공휴일",
  "2026-09-24":"추석 연휴","2026-09-25":"추석","2026-09-26":"추석 연휴","2026-10-03":"개천절","2026-10-05":"대체공휴일",
  "2026-10-09":"한글날","2026-12-25":"성탄절",
  "2027-01-01":"신정","2027-02-06":"설날 연휴","2027-02-07":"설날","2027-02-08":"설날 연휴","2027-02-09":"대체공휴일",
  "2027-03-01":"삼일절","2027-05-05":"어린이날","2027-05-13":"부처님오신날","2027-06-06":"현충일","2027-07-17":"제헌절",
  "2027-07-19":"대체공휴일","2027-08-15":"광복절","2027-08-16":"대체공휴일","2027-09-14":"추석 연휴","2027-09-15":"추석",
  "2027-09-16":"추석 연휴","2027-10-03":"개천절","2027-10-04":"대체공휴일","2027-10-09":"한글날","2027-10-11":"대체공휴일",
  "2027-12-25":"성탄절","2027-12-27":"대체공휴일"
};
const COLORS = ["#f08c00","#1c7ed6","#2f9e44","#e03131","#7048e8","#868e96"];
const DOW = ["일","월","화","수","목","금","토"];
const $ = id => document.getElementById(id);
// 프로그램(exe)에서 열었을 때: ?desktop=<포트>&state=<임의값>
const qs = new URLSearchParams(location.search);
const deskPort = /^\d{4,5}$/.test(qs.get("desktop") || "") ? qs.get("desktop") : null;
const deskState = /^[A-Za-z0-9_-]{16,128}$/.test(qs.get("state") || "") ? qs.get("state") : null;
const desktopMode = !!(deskPort && deskState);
const pad = n => String(n).padStart(2, "0");
const isoOf = dt => `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`;

let auth, db, user = null, events = [];
let view = new Date(); view.setDate(1);
let selected = isoOf(new Date());

function showMsg(text, err){ const m=$("msg"); m.textContent=text; m.className="msg"+(err?" err":""); m.classList.remove("hidden"); $("app").classList.add("hidden"); }

// ---- 일정 계산 (PC 프로그램과 같은 규칙)
function startsOn(e, d){
  if (d < e.date) return false;
  const [,m,dd] = e.date.split("-").map(Number), [,M,D] = d.split("-").map(Number);
  if (e.repeat === "monthly") return D === dd;
  if (e.repeat === "yearly") return M === m && D === dd;
  return d === e.date;
}
function eventOn(e, d){
  if (startsOn(e, d)) return true;
  return (!e.repeat || e.repeat === "none") && !!e.end && e.date <= d && d <= e.end;
}
const holName = d => HOLIDAYS[d] || (events.find(e => e.holiday && eventOn(e, d))?.title) || "";
const dayEvents = d => events.filter(e => eventOn(e, d))
  .sort((a,b) => (a.time||"").localeCompare(b.time||"") || a.title.localeCompare(b.title));

// ---- 불러오기 (users/<내 uid>/events)
async function load(){
  showMsg("불러오는 중…");
  try{
    const snap = await getDocs(collection(db, "users", user.uid, "events"));
    events = [];
    snap.forEach(s => {
      const d = s.data(); if (d.deleted || !d.date) return;
      events.push({ title: d.title||"", date: d.date, end: d.end||"", time: d.time||"", repeat: d.repeat||"none",
        color: Number(d.color)||0, memo: d.memo||"", holiday: !!d.holiday });
    });
    $("msg").classList.add("hidden"); $("app").classList.remove("hidden");
    render();
  }catch(err){
    console.error(err);
    showMsg(err.code === "permission-denied" ? "권한이 없습니다. Firestore 보안 규칙이 게시되었는지 확인하세요." : "불러오지 못했습니다: " + (err.message||err), true);
  }
}

// ---- 그리기
function render(){
  const y = view.getFullYear(), m = view.getMonth();
  $("monthLbl").textContent = `${y}년 ${m+1}월`;
  const first = new Date(y, m, 1), start = new Date(y, m, 1 - first.getDay());
  const weeks = Math.ceil((first.getDay() + new Date(y, m+1, 0).getDate()) / 7);
  const todayIso = isoOf(new Date()), g = $("grid");
  g.innerHTML = "";
  DOW.forEach((n,i) => { const h = document.createElement("div"); h.className = "dow" + (i===0?" sun":i===6?" sat":""); h.textContent = n; g.appendChild(h); });
  for (let i = 0; i < weeks*7; i++){
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), iso = isoOf(dt), dow = dt.getDay();
    const hol = holName(iso), c = document.createElement("div");
    c.className = "cell" + (dow===0?" sun":dow===6?" sat":"") + (dt.getMonth()!==m?" other":"") + (iso===todayIso?" today":"")
      + (iso===selected?" sel":"") + (hol?" hol":"");
    c.innerHTML = `<span class="num">${dt.getDate()}</span>` + (hol ? `<span class="hname">${hol}</span>` : "");
    const list = dayEvents(iso), max = 3;
    list.slice(0, max).forEach(e => {
      const ch = document.createElement("span");
      ch.className = "chip";
      ch.style.background = COLORS[e.color % COLORS.length];
      ch.textContent = (e.time ? e.time + " " : "") + e.title;
      c.appendChild(ch);
    });
    if (list.length > max){ const mo = document.createElement("div"); mo.className = "more"; mo.textContent = `+${list.length-max}개 더`; c.appendChild(mo); }
    c.onclick = () => { selected = iso; render(); };
    g.appendChild(c);
  }
  renderDay();
}
function renderDay(){
  const [y,m,d] = selected.split("-").map(Number), dow = new Date(y, m-1, d).getDay(), hol = holName(selected);
  $("dayTitle").textContent = `${y}년 ${m}월 ${d}일 (${DOW[dow]})` + (hol ? ` · ${hol}` : "");
  const box = $("dayList"); box.innerHTML = "";
  const list = dayEvents(selected);
  if (!list.length){ box.innerHTML = '<div class="msg" style="padding:10px">일정이 없습니다.</div>'; return; }
  list.forEach(e => {
    const row = document.createElement("div"); row.className = "ev";
    const span = e.end && e.end !== e.date ? ` (${e.date} ~ ${e.end})` : "";
    row.innerHTML = `<div class="bar-c" style="background:${COLORS[e.color % COLORS.length]}"></div><div>
      <div class="t"></div><div class="m"></div></div>`;
    row.querySelector(".t").innerHTML = "";
    row.querySelector(".t").append((e.time ? e.time + "  " : "종일  ") + e.title + span);
    row.querySelector(".m").textContent = e.memo;
    box.appendChild(row);
  });
}

// ---- 시작
function start(){
  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId){
    $("btnIn").disabled = true;
    showMsg("파일 위쪽의 FIREBASE_CONFIG 값을 채워 주세요. (Firebase 콘솔 > 프로젝트 설정 > 내 앱)", true);
    return;
  }
  const app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app); db = getFirestore(app);
  $("btnIn").onclick = async () => {
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ if (e.code !== "auth/popup-closed-by-user") showMsg("로그인하지 못했습니다: " + (e.code||e.message), true); }
  };
  $("btnOut").onclick = () => signOut(auth);
  $("deskSend").onclick = () => {
    if (!user) return;
    const q = new URLSearchParams({ state: deskState, refresh: user.refreshToken, uid: user.uid,
      name: user.displayName || "", email: user.email || "" });
    $("deskMsg").textContent = "프로그램으로 전달했습니다. 이 창을 닫으셔도 됩니다.";
    location.href = `http://127.0.0.1:${deskPort}/?` + q.toString();
  };
  onAuthStateChanged(auth, u => {
    user = u;
    $("btnIn").classList.toggle("hidden", !!u); $("btnOut").classList.toggle("hidden", !u);
    $("who").classList.toggle("hidden", !u);
    if (desktopMode){
      $("msg").classList.add("hidden"); $("app").classList.add("hidden"); $("desk").classList.remove("hidden");
      $("deskMsg").textContent = u ? `${u.displayName || u.email} 계정으로 로그인되어 있습니다.` : "위쪽의 '구글 로그인' 버튼으로 로그인하세요.";
      $("deskSend").classList.toggle("hidden", !u);
      return;
    }
    if (u){ $("who").textContent = u.displayName || u.email; load(); }
    else { events = []; showMsg("로그인하면 내 일정을 볼 수 있습니다."); }
  });
}
$("prev").onclick = () => { view.setMonth(view.getMonth()-1); render(); };
$("next").onclick = () => { view.setMonth(view.getMonth()+1); render(); };
$("today").onclick = () => { view = new Date(); view.setDate(1); selected = isoOf(new Date()); render(); };
$("reload").onclick = () => user && load();
start();
</script>
</body>
</html>
